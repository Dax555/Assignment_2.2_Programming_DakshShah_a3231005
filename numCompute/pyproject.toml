[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "NumCompute: a vectorised scientific computing toolkit built with plain Python and NumPy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
keywords = ["numpy", "scientific-computing", "statistics", "preprocessing", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter"]

[tool.setuptools.packages.find]
# Both spellings so installation works whichever way the package folder is capitalised.
include = ["numcompute*", "numCompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
pythonpath = ["."]